name: 'Security & Quality Gate (Shift-Left)'

on:
  push:
    branches: [main, develop, develop-v2]
  pull_request:
    branches: [main, develop, develop-v2]

permissions:
  contents: read
  security-events: write
  actions: read

env:
  ENFORCE_GATE: ${{ (github.event_name == 'pull_request' && github.base_ref == 'main') || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  code-quality:
    name: Lint & Build Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Clean Install Dependencies
        run: npm ci

      - name: Run Linter Checks
        run: npm run lint

      - name: Verify TypeScript Compilation
        run: npm run build

  sast-semgrep:
    name: SAST — Semgrep Pro
    runs-on: ubuntu-latest
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep & Pro Engine
        run: |
          python -m pip install --upgrade pip
          pip install semgrep
          semgrep install-semgrep-pro

      - name: Run Semgrep Pro
        run: |
          semgrep scan --pro \
            --config p/nestjs \
            --config p/typescript \
            --config p/secrets \
            --sarif \
            --output semgrep.sarif \
            --metrics=off

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep-pro

      - name: Gate — fail on ERROR findings (main only)
        if: ${{ always() && env.ENFORCE_GATE == 'true' }}
        run: |
          count=$(jq '[.runs[].results[]? | select(.level == "error")] | length' semgrep.sarif)
          echo "Semgrep Pro findings with level=error: $count"
          if [ "$count" -gt 0 ]; then
            echo "::error::Semgrep Pro reported $count error-level finding(s). Merge into main is blocked."
            exit 1
          fi

  semgrep-access-policy:
    name: SAST — Access Policy Rules (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Test Semgrep rules (fixtures)
        run: |
          semgrep --test --metrics=off \
            --config .semgrep/nestjs-security.yml \
            .semgrep/nestjs-security.ts

      - name: Scan source with custom rules
        run: |
          semgrep scan \
            --config .semgrep/ \
            --metrics=off \
            --sarif \
            --output semgrep-access-policy.sarif \
            src/

      - name: Upload custom rules SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-access-policy.sarif
          category: semgrep-access-policy

      - name: Gate — fail on ERROR findings (main only)
        if: ${{ always() && env.ENFORCE_GATE == 'true' }}
        run: |
          count=$(jq '[.runs[].results[]? | select(.level == "error")] | length' semgrep-access-policy.sarif)
          echo "Custom rules findings with level=error: $count"
          if [ "$count" -gt 0 ]; then
            echo "::error::Custom Semgrep rules reported $count error-level finding(s). Merge into main is blocked."
            exit 1
          fi

  # SBOM
  sca-dependencies:
    name: SCA — Dependencies & Licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Clean Install Dependencies
        run: npm ci

      - name: Audit Dependencies (NPM Audit)
        run: npm audit --audit-level=high

      - name: Check Disallowed Licenses
        run: |
          npx license-checker \
            --failOn 'GPL;AGPL;SSPL;LGPL-2.0' \
            --excludePrivatePackages \
            --json > licenses.json

      - name: Upload License Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: license-report
          path: licenses.json
          retention-days: 30

  dockerfile-lint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  container-security:
    name: Container Vulnerabilities (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image for Scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: app:local-scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: app:local-scan
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          exit-code: '0'

      - name: Upload Trivy Image SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-container

      - name: Gate — fail on HIGH/CRITICAL findings (main only)
        if: ${{ always() && env.ENFORCE_GATE == 'true' }}
        run: |
          count=$(jq '[.runs[].results[]? | select(.level == "error")] | length' trivy-image.sarif)
          echo "Trivy findings with level=error: $count"
          if [ "$count" -gt 0 ]; then
            echo "::error::Trivy reported $count HIGH/CRITICAL finding(s). Merge into main is blocked."
            exit 1
          fi
