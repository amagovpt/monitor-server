rules:
  # 1. Todo o Controller tem de ter JwtAuthGuard declarado ao nível da classe
  - id: nestjs-controller-missing-security-guards
    languages: [typescript]
    severity: ERROR
    message: >-
      Todo o Controller deve declarar @UseGuards(...) contendo JwtAuthGuard ao nível da classe.
    paths:
      include:
        - 'src/**/*.controller.ts'
    patterns:
      - pattern: |
          @Controller(...)
          export class $CONTROLLER { ... }
      - pattern-not: |
          @UseGuards(..., JwtAuthGuard, ...)
          @Controller(...)
          export class $CONTROLLER { ... }
      - pattern-not: |
          @Controller(...)
          @UseGuards(..., JwtAuthGuard, ...)
          export class $CONTROLLER { ... }

  - id: nestjs-method-missing-roles-decorator
    languages: [typescript]
    severity: ERROR
    message: >-
      Método HTTP sem decorator @Roles(...) explícito.
    paths:
      include:
        - 'src/**/*.controller.ts'
    patterns:
      - pattern-either:
          - pattern: |
              @Get(...)
              $METHOD(...) { ... }
          - pattern: |
              @Post(...)
              $METHOD(...) { ... }
          - pattern: |
              @Put(...)
              $METHOD(...) { ... }
          - pattern: |
              @Delete(...)
              $METHOD(...) { ... }
          - pattern: |
              @Patch(...)
              $METHOD(...) { ... }
      # Não pode ter @Roles em qualquer posição da stack de decorators
      - pattern-not-inside: |
          class $CLASS {
            ...
            @Roles(...)
            $METHOD(...) { ... }
            ...
          }

      # Exclui métodos decorados com @Public() ou @Public(...)
      - pattern-not-inside: |
          class $CLASS {
            ...
            @Public(...)
            $METHOD(...) { ... }
            ...
          }
      - pattern-not-inside: |
          class $CLASS {
            ...
            @Public
            $METHOD(...) { ... }
            ...
          }
      - pattern-not: |
          @Roles(...)
          ...
          $METHOD(...) { ... }

  # 3. Rotas parametrizadas com :parametro devem ter @FgaAuthorized
  - id: nestjs-parameterized-route-missing-fga
    languages: [typescript]
    severity: WARNING
    message: >-
      Endpoint parametrizado sem @FgaAuthorized(...). Valida se requer ReBAC via OpenFGA.
    paths:
      include:
        - 'src/**/*.controller.ts'
    patterns:
      - pattern-either:
          - pattern: |
              @Get($ROUTE)
              $METHOD(...) { ... }
          - pattern: |
              @Post($ROUTE)
              $METHOD(...) { ... }
          - pattern: |
              @Put($ROUTE)
              $METHOD(...) { ... }
          - pattern: |
              @Delete($ROUTE)
              $METHOD(...) { ... }
          - pattern: |
              @Patch($ROUTE)
              $METHOD(...) { ... }
      - metavariable-regex:
          metavariable: $ROUTE
          regex: '.*:.*'
      # Exclui se @FgaAuthorized existir em qualquer ordem antes do método
      - pattern-not: |
          @FgaAuthorized(...)
          ...
          $METHOD(...) { ... }

  # 4. Tipagem estrita de retorno em Controllers
  - id: nestjs-avoid-any-return-in-controller
    languages: [typescript]
    severity: WARNING
    message: >-
      Uso de Promise<any> ou any detetado. Usa DTOs tipados.
    paths:
      include:
        - 'src/**/*.controller.ts'
    patterns:
      - pattern-either:
          - pattern: |
              async $METHOD(...): Promise<any> { ... }
          - pattern: |
              $METHOD(...): Promise<any> { ... }
          - pattern: |
              $METHOD(...): any { ... }
